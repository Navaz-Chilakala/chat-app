# Weekly dependency update pull requests: npm packages of the Telecom Knowledge AI app and the
# GitHub Actions used by its workflows. Minor/patch npm updates are grouped into one PR; major npm
# versions (TypeScript, vitest, undici, ...) change APIs and are upgraded deliberately, not by bot.
version: 2
updates:
  - package-ecosystem: npm
    directory: /telecom-ai
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
