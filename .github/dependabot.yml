# Weekly dependency update pull requests: npm packages of the Telecom Knowledge AI app and the
# GitHub Actions used by its workflows. Minor/patch npm updates are grouped into one PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /telecom-ai
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
